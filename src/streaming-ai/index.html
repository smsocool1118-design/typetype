<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>typetype AI 整理</title>
    <link rel="stylesheet" href="../shared/base.css" />
    <style>
      .streaming-ai-shell { min-width: 340px; }
      .streaming-ai-actions { overflow-x: auto; padding-bottom: 2px; }
      .streaming-ai-template select { max-width: 210px; }
      /* 迷你竖窗：整体小字，原文 + 结构化参考两块竖排各占约一半高、可分别滚动。 */
      .panel-mini { font-size: 12px; }
      .panel-mini .streaming-ai-layout { height: 100vh; display: flex; flex-direction: column; min-height: 0; }
      .panel-mini .streaming-ai-header { padding: 8px 10px; }
      .panel-mini .streaming-ai-header h1, .panel-mini .streaming-ai-header .settings-kicker, .panel-mini .streaming-ai-status { display: none; }
      .panel-mini .streaming-ai-actions { width: 100%; gap: 6px; }
      .panel-mini .streaming-ai-template span, .panel-mini #copy-raw-button, .panel-mini #clear-button, .panel-mini #weekly-report-button { display: none; }
      .panel-mini .streaming-ai-columns { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; gap: 8px; padding: 0 10px 10px; overflow: hidden; }
      .panel-mini .streaming-ai-pane { flex: 1 1 50%; min-height: 0; display: flex; flex-direction: column; }
      .panel-mini .streaming-ai-pane-heading h2 { font-size: 12px; margin: 0; }
      .panel-mini .streaming-ai-text { flex: 1 1 auto; min-height: 0; max-height: none; overflow: auto; font-size: 12px; line-height: 1.55; }
      .panel-standard .workbench-only, .panel-mini .workbench-only { display: none; }
      .panel-workbench .streaming-ai-header { display: grid; grid-template-columns: minmax(0, 1fr); }
      .panel-workbench .streaming-ai-actions { justify-content: flex-start; }
      .streaming-workbench { padding: 0 18px 16px; }
      .streaming-workbench-actions { display: grid; grid-template-columns: repeat(6, minmax(100px, 1fr)); gap: 8px; }
      .streaming-workbench-actions button { min-height: 38px; }
      @media (max-width: 700px) {
        .streaming-ai-header { padding: 12px; }
        .streaming-ai-columns { grid-template-columns: 1fr; overflow: auto; }
        .streaming-ai-actions { width: 100%; }
        .streaming-workbench-actions { grid-template-columns: repeat(2, minmax(100px, 1fr)); }
      }
    </style>
  </head>
  <body class="streaming-ai-shell">
    <main class="streaming-ai-layout">
      <header class="streaming-ai-header">
        <div>
          <p class="settings-kicker">流式 AI 整理</p>
          <h1>AI 修正原文与整理稿</h1>
        </div>
        <div class="streaming-ai-actions">
          <label class="streaming-ai-template">
            <span>本次模板</span>
            <select id="streaming-scenario-select">
              <optgroup label="常用润写">
                <option value="general">通用整理</option>
                <option value="meeting_notes">会议纪要</option>
                <option value="work_report">工作汇报</option>
                <option value="message_reply">邮件/微信回复</option>
                <option value="todo_list">待办清单</option>
                <option value="study_notes">学习笔记</option>
                <option value="customer_service">客服记录</option>
              </optgroup>
              <optgroup label="党政机关公文">
                <option value="official_resolution">决议</option>
                <option value="official_decision">决定</option>
                <option value="official_order">命令（令）</option>
                <option value="official_communique">公报</option>
                <option value="official_announcement">公告</option>
                <option value="official_public_notice">通告</option>
                <option value="official_opinion">意见</option>
                <option value="official_notice">通知</option>
                <option value="official_circular">通报</option>
                <option value="official_report">报告</option>
                <option value="official_request">请示</option>
                <option value="official_reply">批复</option>
                <option value="official_proposal">议案</option>
                <option value="official_letter">函</option>
                <option value="official_minutes">纪要</option>
              </optgroup>
              <optgroup label="公司/白领常用">
                <option value="business_notice">公司通知</option>
                <option value="business_plan">工作计划</option>
                <option value="business_summary">工作总结</option>
                <option value="business_proposal">工作方案</option>
                <option value="business_email">商务邮件/微信</option>
                <option value="business_memo">备忘录</option>
                <option value="business_application">申请/审批说明</option>
                <option value="business_meeting_minutes">企业会议纪要</option>
              </optgroup>
              <optgroup label="学生/校园常用">
                <option value="student_leave_note">请假条</option>
                <option value="student_report">实习/实践报告</option>
                <option value="student_activity_plan">活动策划</option>
                <option value="student_speech">演讲稿</option>
                <option value="student_review">学习总结</option>
              </optgroup>
            </select>
          </label>
          <label class="streaming-ai-template workbench-only">
            <span>行业包</span>
            <select id="streaming-industry-select"></select>
          </label>
          <label class="streaming-ai-template">
            <span>面板</span>
            <select id="streaming-panel-mode-select">
              <option value="mini">迷你</option><option value="standard">标准</option><option value="workbench">工作台</option>
            </select>
          </label>
          <button type="button" class="settings-secondary-button" id="copy-raw-button">复制原文</button>
          <button type="button" class="settings-secondary-button" id="copy-ai-button">复制整理稿</button>
          <button type="button" class="settings-secondary-button" id="export-docx-button">导出公文 Word</button>
          <button type="button" class="settings-secondary-button" id="weekly-report-button">本周汇总</button>
          <button type="button" class="settings-secondary-button" id="clear-button">清空本次记录</button>
        </div>
      </header>

      <section class="streaming-ai-status" data-tone="" id="status-card">
        <strong id="status-title">等待录音</strong>
        <span id="status-text">开启流式输出并打开“流式 AI 整理面板”后，这里会显示实时状态。</span>
        <em id="status-meta"></em>
      </section>

      <section class="streaming-ai-columns">
        <article class="streaming-ai-pane">
          <div class="streaming-ai-pane-heading">
            <h2>AI 修正原文</h2>
            <div class="streaming-ai-inline-actions">
              <span id="raw-count">0 字</span>
              <button type="button" class="settings-secondary-button" id="apply-refined-raw-button">一键带入</button>
            </div>
          </div>
          <pre id="raw-text" class="streaming-ai-text empty">等待 AI 修正原文…</pre>
        </article>

        <article class="streaming-ai-pane">
          <div class="streaming-ai-pane-heading">
            <h2 id="ai-pane-title">AI 结构化整理稿</h2>
            <div class="streaming-ai-inline-actions">
              <span id="ai-count">0 字</span>
              <button type="button" class="settings-secondary-button" id="apply-ai-button">一键带入整理稿</button>
            </div>
          </div>
          <pre id="ai-text" class="streaming-ai-text empty">检测到停顿后，会在这里生成纠错稿或会议纪要草稿。</pre>
        </article>
      </section>
      <section class="streaming-workbench workbench-only">
        <div class="streaming-workbench-actions">
          <button type="button" class="settings-secondary-button" data-office-action="raw">原文</button>
          <button type="button" class="settings-secondary-button" data-office-action="corrected">修正稿</button>
          <button type="button" class="settings-secondary-button" data-office-action="formal">结构化参考</button>
          <button type="button" class="settings-secondary-button" data-office-action="todo">待办</button>
          <button type="button" class="settings-secondary-button" data-office-action="risk">风险点</button>
          <button type="button" class="settings-secondary-button" data-office-action="reply">下一步回复</button>
        </div>
      </section>
    </main>

    <script>
      (() => {
        const electronAPI = window.electronAPI;
        const statusCard = document.querySelector("#status-card");
        const statusTitle = document.querySelector("#status-title");
        const statusText = document.querySelector("#status-text");
        const statusMeta = document.querySelector("#status-meta");
        const rawText = document.querySelector("#raw-text");
        const aiText = document.querySelector("#ai-text");
        const rawCount = document.querySelector("#raw-count");
        const aiCount = document.querySelector("#ai-count");
        const scenarioSelect = document.querySelector("#streaming-scenario-select");
        const industrySelect = document.querySelector("#streaming-industry-select");
        const panelModeSelect = document.querySelector("#streaming-panel-mode-select");
        const aiPaneTitle = document.querySelector("#ai-pane-title");
        const copyRawButton = document.querySelector("#copy-raw-button");
        const copyAiButton = document.querySelector("#copy-ai-button");
        const exportDocxButton = document.querySelector("#export-docx-button");
        const weeklyReportButton = document.querySelector("#weekly-report-button");
        const clearButton = document.querySelector("#clear-button");
        const applyRefinedRawButton = document.querySelector("#apply-refined-raw-button");
        const applyAiButton = document.querySelector("#apply-ai-button");
        let selectedOfficeAction = "formal";
        let lastState = null;

        async function populateCatalog() {
          const catalog = await electronAPI.getOfficeTemplateCatalog();
          const groups = new Map();
          for (const template of catalog.templates || []) {
            if (!groups.has(template.group)) groups.set(template.group, []);
            groups.get(template.group).push(template);
          }
          scenarioSelect.innerHTML = "";
          for (const [label, templates] of groups) {
            const group = document.createElement("optgroup");
            group.label = label;
            for (const template of templates) {
              const option = document.createElement("option");
              option.value = template.id;
              option.textContent = template.name;
              group.append(option);
            }
            scenarioSelect.append(group);
          }
          industrySelect.innerHTML = "";
          for (const pack of catalog.industry_packs || []) {
            const option = document.createElement("option");
            option.value = pack.id;
            option.textContent = pack.name;
            industrySelect.append(option);
          }
          if (lastState) render(lastState);
        }

        function statusTitleFor(status) {
          switch (status) {
            case "recording":
              return "正在记录";
            case "thinking":
              return "AI 整理中";
            case "ready":
              return "整理稿已更新";
            case "error":
              return "AI 整理不可用";
            default:
              return "等待录音";
          }
        }

        function toneFor(status) {
          if (status === "error") return "error";
          if (status === "ready" || status === "recording") return "success";
          if (status === "thinking") return "thinking";
          return "";
        }

        function renderText(element, value, placeholder) {
          const text = value?.trim() ? value : placeholder;
          element.textContent = text;
          element.classList.toggle("empty", !value?.trim());
        }

        function cleanStatusText(value) {
          const text = value?.trim() || "等待录音。";
          if (/ONNX\s*Runtime|onnxruntime|Visual C\+\+|系统运行库|app\.asar|node_modules|The operating system cannot run %1/i.test(text)) {
            return "本地断句增强暂不可用，已使用基础断句；可在设置页修复系统运行库。";
          }
          return text;
        }

        function render(state) {
          lastState = state;
          document.body.classList.remove("panel-mini", "panel-standard", "panel-workbench");
          document.body.classList.add(`panel-${state.panel_mode || "standard"}`);
          statusCard.dataset.tone = toneFor(state.status);
          statusTitle.textContent = statusTitleFor(state.status);
          statusText.textContent = cleanStatusText(state.status_text);
          const reviewText = state.last_review_at
            ? `最近整理：${new Date(state.last_review_at).toLocaleTimeString()}`
            : "尚未整理";
          const applyText = state.apply_status_text ? ` · ${state.apply_status_text}` : "";
          // 提示稿件里还有哪些要素是"待补充"，用户可用「修订当前稿件」逐项补全。
          const pending = Array.isArray(state.pending_placeholders) ? state.pending_placeholders : [];
          const pendingText = pending.length > 0
            ? ` · 待补充 ${pending.length} 项：${pending.join("、")}`
            : "";
          statusMeta.textContent = `${state.mode_label || "流式模式"} · ${state.industry_pack_label || "通用办公"} · ${state.rewrite_scenario_label || "通用整理"} · ${state.ai_status_label || "等待"} · ${reviewText}${applyText}${pendingText}`;

          const refinedRaw = state.refined_raw_text?.trim() ? state.refined_raw_text : state.raw_text;
          const actionResult = officeActionText(state, selectedOfficeAction);
          renderText(rawText, refinedRaw, "等待 AI 修正原文…");
          renderText(aiText, actionResult.text, "检测到停顿后，会在这里生成结构化整理稿。");
          aiPaneTitle.textContent = actionResult.label;
          if (scenarioSelect && state.rewrite_scenario && scenarioSelect.value !== state.rewrite_scenario) {
            scenarioSelect.value = state.rewrite_scenario;
          }
          if (industrySelect && state.industry_pack) industrySelect.value = state.industry_pack;
          if (panelModeSelect && state.panel_mode) panelModeSelect.value = state.panel_mode;
          rawCount.textContent = `${refinedRaw?.length ?? 0} 字`;
          aiCount.textContent = `${actionResult.text?.length ?? 0} 字`;
          copyRawButton.disabled = !(refinedRaw?.trim());
          copyAiButton.disabled = !(state.ai_text?.trim());
          clearButton.disabled = !(refinedRaw?.trim() || state.ai_text?.trim());
          applyRefinedRawButton.disabled = !(state.can_apply_refined_raw && refinedRaw?.trim());
          applyAiButton.disabled = !(state.ai_text?.trim());
        }

        function officeActionText(state, action) {
          const corrected = state.refined_raw_text?.trim() || state.raw_text?.trim() || "";
          const formal = state.ai_text?.trim() || corrected;
          if (action === "raw") return { label: "原文", text: state.raw_text || "" };
          if (action === "corrected") return { label: "修正稿", text: corrected };
          if (action === "todo") return { label: "待办", text: formal.split(/[。；\n]/).filter((line) => /(需要|请|应当|负责|截止|完成|跟进)/.test(line)).join("\n") };
          if (action === "risk") return { label: "风险点", text: formal.split(/[。；\n]/).filter((line) => /(风险|问题|隐患|异常|不足|延误)/.test(line)).join("\n") };
          if (action === "reply") return { label: "下一步回复", text: formal ? "已收到。将根据上述事项继续推进，并及时反馈进展。" : "" };
          return { label: "结构化参考", text: formal };
        }

        function renderDisconnected(message) {
          statusCard.dataset.tone = "error";
          statusTitle.textContent = "面板未连接";
          statusText.textContent = message;
          statusMeta.textContent = "请关闭面板后重新打开，或重启 typetype。";
        }

        async function callAndRender(action) {
          try {
            const state = await action();
            render(state);
          } catch (error) {
            renderDisconnected(error instanceof Error ? error.message : String(error));
          }
        }

        if (!electronAPI) {
          renderDisconnected("没有连接到 typetype 主进程，面板无法接收实时原文。");
          return;
        }

        copyRawButton.addEventListener("click", () => {
          void callAndRender(() => electronAPI.copyStreamingAiRaw());
        });

        copyAiButton.addEventListener("click", () => {
          void callAndRender(() => electronAPI.copyStreamingAiSummary());
        });

        applyRefinedRawButton.addEventListener("click", () => {
          void callAndRender(() => electronAPI.applyStreamingAiRefinedRaw());
        });

        applyAiButton.addEventListener("click", () => {
          void callAndRender(() => electronAPI.applyStreamingAiSummary());
        });

        exportDocxButton.addEventListener("click", async () => {
          exportDocxButton.disabled = true;
          try {
            const title = (lastState?.raw_text || lastState?.ai_text || "")
              .replace(/\s+/g, " ").trim().slice(0, 24);
            const result = await electronAPI.exportOfficeDocx({
              title,
              content: aiText.textContent || "",
            });
            if (result?.ok) {
              statusText.textContent = `已导出公文 Word：${result.path}`;
            } else if (result?.error) {
              statusText.textContent = result.error;
            }
          } finally {
            exportDocxButton.disabled = false;
          }
        });

        weeklyReportButton.addEventListener("click", async () => {
          weeklyReportButton.disabled = true;
          try {
            await callAndRender(() => electronAPI.generateWeeklyReport());
          } finally {
            weeklyReportButton.disabled = false;
          }
        });

        scenarioSelect.addEventListener("change", () => {
          void callAndRender(() => electronAPI.setStreamingAiScenario(scenarioSelect.value));
        });
        industrySelect.addEventListener("change", () => {
          void callAndRender(() => electronAPI.setIndustryPack(industrySelect.value));
        });
        panelModeSelect.addEventListener("change", () => {
          void callAndRender(() => electronAPI.setOfficePanelMode(panelModeSelect.value));
        });
        for (const button of document.querySelectorAll("[data-office-action]")) {
          button.addEventListener("click", () => {
            selectedOfficeAction = button.dataset.officeAction;
            if (lastState) render(lastState);
          });
        }

        clearButton.addEventListener("click", () => {
          void callAndRender(() => electronAPI.clearStreamingAiPanel());
        });

        void populateCatalog().catch(() => {});
        electronAPI.subscribeStreamingAiPanelState(render);

        window.setInterval(() => {
          void electronAPI.getStreamingAiPanelState()
            .then(render)
            .catch((error) => {
              renderDisconnected(error instanceof Error ? error.message : String(error));
            });
        }, 1000);
      })();
    </script>
  </body>
</html>
